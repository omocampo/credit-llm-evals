name: Run Credit LLM Evals

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install google-genai scikit-learn pydantic

      - name: Ejecutar Evaluation Harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python evaluate.py
