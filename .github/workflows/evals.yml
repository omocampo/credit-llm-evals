name: Run Credit LLM Evals

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código del repositorioß
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install google-genai scikit-learn pydantic

      - name: Ejecutar Evaluation Harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u evaluate.py
        timeout-minutes: 20

      - name: Run DeepEval Pytest Regression Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: python -m deepeval test run test_deepeval.py
        timeout-minutes: 20

      - name: Guardar eval_results.json en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add eval_results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update eval_results.json [skip ci]" && git push)
